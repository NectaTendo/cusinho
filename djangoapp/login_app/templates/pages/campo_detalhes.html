{% extends "pages/base.html" %}
{% load static %}

{% block extra_head %}
<link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css">
<style>
    /* Tema Escuro Principal */
    .modal-partidas {
        position: fixed;
        top: 0;
        right: 0;
        width: 400px;
        height: 100vh;
        margin: 0;
        transform: translateX(100%);
        transition: transform 0.3s ease-out;
        z-index: 1060;
    }
    
    .modal-partidas.show {
        transform: translateX(0);
    }
    
    .modal-partidas .modal-content {
        height: 100vh;
        border-radius: 0;
        border-left: 1px solid #4CAF50;
    }
    
    .modal-partidas .modal-header {
        background-color: #4CAF50;
        color: white;
    }
    
    .modal-partidas .modal-body {
        overflow-y: auto;
        padding: 0;
    }
    
    .partida-item {
        padding: 15px;
        border-bottom: 1px solid #383838;
        transition: background-color 0.2s;
    }
    
    .partida-item:hover {
        background-color: #2e2e2e;
    }
    
    .partida-titulo {
        font-weight: 600;
        color: #4CAF50;
        margin-bottom: 5px;
    }
    
    .partida-info {
        display: flex;
        justify-content: space-between;
        font-size: 0.9rem;
        color: #bdbdbd;
    }
    
    .partida-vagas {
        color: #ffc107;
        font-weight: 500;
    }
    
    .backdrop-partidas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: rgba(0,0,0,0.5);
        z-index: 1050;
        display: none;
    }
    
    .backdrop-partidas.show {
        display: block;
    }

    body {
        background-color: #121212;
        color: #e0e0e0;
    }
    
    /* Container Principal */
    .campo-container {
        background-color: #1e1e1e;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        padding: 30px;
        margin-top: 30px;
        border: 1px solid #333;
    }
    
    /* Filtros - Card Estilizado */
    .filter-card {
        background: #252525;
        border-radius: 12px;
        padding: 25px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        margin-bottom: 30px;
        border: 1px solid #383838;
    }
    
    .filter-card h4 {
        color: #ffffff;
        margin-bottom: 25px;
        font-weight: 600;
        border-bottom: 2px solid #4CAF50;
        padding-bottom: 10px;
        display: inline-block;
    }
    
    /* Inputs e Selects */
    .form-control, .form-select {
        background-color: #333;
        border: 1px solid #444;
        color: #fff;
        border-radius: 8px;
        padding: 12px 15px;
        transition: all 0.3s;
    }
    
    .form-control:focus, .form-select:focus {
        background-color: #3a3a3a;
        border-color: #4CAF50;
        box-shadow: 0 0 0 0.25rem rgba(76, 175, 80, 0.25);
        color: #fff;
    }
    
    /* Labels */
    .form-label {
        color: #bdbdbd;
        font-weight: 500;
        margin-bottom: 8px;
        display: block;
    }
    
    /* Botões */
    .btn-primary {
        background-color: #4CAF50;
        border: none;
        padding: 12px 25px;
        font-weight: 600;
        border-radius: 8px;
        transition: all 0.3s;
    }
    
    .btn-primary:hover {
        background-color: #3d8b40;
        transform: translateY(-2px);
    }
    
    .btn-outline-secondary {
        border-color: #555;
        color: #aaa;
        padding: 12px 25px;
        border-radius: 8px;
        font-weight: 500;
    }
    
    .btn-outline-secondary:hover {
        background-color: #333;
        color: #fff;
        border-color: #666;
    }
    
    /* Grupo de Filtros */
    .filter-group {
        margin-bottom: 20px;
    }
    
    /* Layout dos Filtros */
    .filters-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
        margin-bottom: 20px;
    }
    
    /* Modal de Reserva */
    .modal-content {
        background-color: #252525;
        border: 1px solid #383838;
        border-radius: 12px;
    }
    
    .modal-header {
        border-bottom: 1px solid #383838;
    }
    
    .modal-title {
        color: #fff;
    }
    
    .btn-close {
        filter: invert(1);
    }
    
    /* Ajustes do Calendário para Tema Escuro */
    #calendar {
        background-color: #252525;
        border-radius: 12px;
        padding: 20px;
        border: 1px solid #383838;
    }
    
    .fc-toolbar-title {
        color: #fff !important;
    }
    
    .fc-col-header-cell-cushion {
        color: #e0e0e0;
    }
</style>
{% endblock %}

{% block content %}
<div class="container my-4">
    <!-- Cabeçalho com imagem do campo -->
    <div class="campo-header" style="background-image: url('{{ imagem_capa }}')">
        <div class="campo-header-overlay">
            <h1 class="campo-title">{{ nome }}</h1>
        </div>
    </div>

    <!-- Filtros -->
    <div class="filter-card">
        <h4 class="mb-4">Filtrar Partidas</h4>
        <div class="row">
            <div class="col-md-4 mb-3">
                <label for="filtro-categoria" class="form-label">Categoria</label>
                <select id="filtro-categoria" class="form-select">
                    <option value="todas">Todas</option>
                    <option value="infantil">Infantil</option>
                    <option value="juvenil">Juvenil</option>
                    <option value="adulto">Adulto</option>
                </select>
            </div>
            <div class="col-md-4 mb-3">
                <label for="filtro-genero" class="form-label">Gênero</label>
                <select id="filtro-genero" class="form-select">
                    <option value="todos">Todos</option>
                    <option value="masculino">Masculino</option>
                    <option value="feminino">Feminino</option>
                    <option value="misto">Misto</option>
                </select>
            </div>
            <div class="col-md-4 mb-3">
                <label for="filtro-data" class="form-label">Data</label>
                <input type="date" id="filtro-data" class="form-control">
            </div>
        </div>
        <div class="text-end">
            <button id="btn-filtrar" class="btn btn-primary">Encontrar Jogos</button>
            <button id="btn-limpar" class="btn btn-outline-secondary ms-2">Limpar</button>
        </div>
    </div>

    <!-- Calendário Interativo -->
    <div id="calendar"></div>
>

    </div>
</div>

<div class="backdrop-partidas" id="backdropPartidas"></div>
<div class="modal-partidas" id="modalPartidas">
    <div class="modal-content">
        <div class="modal-header">
            <h5 class="modal-title">Partidas Encontradas</h5>
            <button type="button" class="btn-close" id="closeModalPartidas"></button>
        </div>
        <div class="modal-body" id="partidasFiltradasBody">
            <!-- Partidas serão carregadas aqui via JavaScript -->
        </div>
    </div>
</div>

{% endblock %}

{% block extra_js %}
<!-- Adicione jQuery antes do Bootstrap -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>

<script>
// Verificação de carregamento seguro
function whenReady(callback) {
    if (document.readyState !== 'loading') {
        callback();
    } else {
        document.addEventListener('DOMContentLoaded', callback);
    }
}

whenReady(function() {
    console.log('DOM completamente carregado e pronto');
    
    // Debug inicial
    console.log('Verificando elementos do DOM:');
    console.log('btn-filtrar:', document.getElementById('btn-filtrar'));
    console.log('btn-limpar:', document.getElementById('btn-limpar'));
    console.log('modalPartidas:', document.getElementById('modalPartidas'));
    
    try {
        // Verificação robusta dos dados
        const partidasJson = '{{ partidas_json|escapejs }}';
        console.log('Dados recebidos do servidor:', partidasJson);
        
        let partidas = [];
        if (partidasJson && partidasJson !== '[]') {
            partidas = JSON.parse(partidasJson);
        }
        console.log('Partidas parseadas:', partidas);
        
        // Elementos com verificação explícita
        const getElementOrFail = (id) => {
            const el = document.getElementById(id);
            if (!el) throw new Error(`Elemento #${id} não encontrado`);
            return el;
        };
        
        const btnFiltrar = getElementOrFail('btn-filtrar');
        const btnLimpar = getElementOrFail('btn-limpar');
        const modalPartidas = getElementOrFail('modalPartidas');
        const backdropPartidas = getElementOrFail('backdropPartidas');
        const closeModalBtn = getElementOrFail('closeModalPartidas');
        const partidasBody = getElementOrFail('partidasFiltradasBody');
        
        // Funções do modal
        const showPartidasModal = (filteredPartidas) => {
            console.log('Exibindo modal com:', filteredPartidas);
            
            partidasBody.innerHTML = filteredPartidas.length === 0
                ? '<div class="p-3 text-center">Nenhuma partida encontrada com esses filtros.</div>'
                : filteredPartidas.map(partida => `
                    <a href="/partida/${partida.id}/" class="partida-item-link" style="text-decoration: none; color: inherit;">
                        <div class="partida-item" style="border: 1px solid #ccc; border-radius: 8px; padding: 15px; margin-bottom: 15px; transition: background 0.3s;">
                            <div class="partida-titulo" style="font-size: 18px; font-weight: bold;">${partida.titulo || 'Sem título'}</div>
                            <div class="partida-info">
                                <span>${partida.data ? new Date(`${partida.data}T${partida.horario || '00:00'}`).toLocaleString() : 'Data não informada'}</span>
                                <span class="partida-vagas" style="margin-left: 10px;">${partida.vagas || 0} vagas</span>
                            </div>
                            <div class="partida-info">
                                <span>${partida.categoria || 'Sem categoria'} - ${partida.genero || 'Sem gênero'}</span>
                            </div>
                        </div>
                    </a>
                `).join('');

            
            modalPartidas.classList.add('show');
            backdropPartidas.classList.add('show');
            document.body.style.overflow = 'hidden';
        };
        
        const hidePartidasModal = () => {
            modalPartidas.classList.remove('show');
            backdropPartidas.classList.remove('show');
            document.body.style.overflow = '';
        };
        
        // Event listeners com prevenção de duplicação
        function setupEventListeners() {
    // Adiciona eventos diretamente (sem clonar botões)
            document.getElementById('btn-filtrar').addEventListener('click', handleFiltrarClick);
            document.getElementById('btn-limpar').addEventListener('click', handleLimparClick);
            document.getElementById('closeModalPartidas').addEventListener('click', hidePartidasModal);
            document.getElementById('backdropPartidas').addEventListener('click', hidePartidasModal);

            console.log('Event listeners configurados com sucesso');
        }

        
        // Handlers de eventos
        function handleFiltrarClick() {
            console.log('Botão filtrar clicado - evento capturado');
            
            const categoria = document.getElementById('filtro-categoria').value;
            const genero = document.getElementById('filtro-genero').value;
            const data = document.getElementById('filtro-data').value;
            
            console.log('Valores dos filtros:', {categoria, genero, data});
            
            const filteredPartidas = partidas.filter(partida => {
                const matches = {
                    categoria: categoria === 'todas' || partida.categoria === categoria,
                    genero: genero === 'todos' || partida.genero === genero,
                    data: !data || partida.data === data
                };
                
                console.log(`Partida ${partida.titulo} matches:`, matches);
                return matches.categoria && matches.genero && matches.data;
            });
            
            showPartidasModal(filteredPartidas);
        }
        
        function handleLimparClick() {
            console.log('Botão limpar clicado - evento capturado');
            
            document.getElementById('filtro-categoria').value = 'todas';
            document.getElementById('filtro-genero').value = 'todos';
            document.getElementById('filtro-data').value = '';
            
            hidePartidasModal();
        }
        
        // Inicialização
        setupEventListeners();
        console.log('Configuração completa concluída');
        
        // Teste programático - remover após verificação
        console.log('Realizando teste automático...');

        
    } catch (error) {
        console.error('Erro durante a inicialização:', error);
        alert('Erro: ' + error.message);
    }
});
</script>
{% endblock %}
