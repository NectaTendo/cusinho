{% extends "pages/base.html" %}
{% load static %}
{% load i18n %}

{% block extra_head %}
<link rel="stylesheet" href="{% static 'css/style.css' %}">
<link rel="shortcut icon" href="{% static 'images\Goal_icon-icons.com_62267.ico' %}" type="image/x-icon">
<style>
    .intro-section {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
        background-color: #1a1a1a;
        color: white;
        margin: 30px auto 20px;
        border-radius: 8px;
        max-width: 1500px;
        margin-top: 110px;
    }

    .sport-icons {
        display: flex;
        justify-content: center;
        gap: 30px;
        margin: 20px 0;
        flex-wrap: wrap;
        width: 100%;
    }
    
    .sport-icon {
        text-align: center;
        transition: transform 0.3s;
        cursor: pointer;
    }
    
    .sport-icon:hover {
        transform: scale(1.1);
    }
    
    .sport-icon img {
        width: 80px;
        height: 80px;
        object-fit: cover;
        border-radius: 50%;
        padding: 5px;
        background-color: #333;
        border: 2px solid #4CAF50;
    }

    .sport-icon a {
        text-decoration: none;
        color: white;
        display: flex;
        flex-direction: column;
        align-items: center;
    }
</style>
{% endblock %}

{% block content %}
<div class="content">
    <div class="intro-section">
        <h1>Bem-vindo ao Esportefy!</h1>
        <p>Encontre os melhores campos esportivos da sua região</p>
        
        <div class="sport-icons">
            <div class="sport-icon">
                <a href="{% url 'available_places' %}">
                    <img src="{% static 'images/soccer-ball.png' %}" alt="Futebol">
                    <span>Futebol</span>
                </a>
            </div>
            <div class="sport-icon">
                <a href="{% url 'available_places' %}">
                    <img src="{% static 'images/basketball.jpg' %}" alt="Basquete">
                    <span>Basquete</span>
                </a>
            </div>
            <div class="sport-icon">
                <a href="{% url 'available_places' %}">
                    <img src="{% static 'images/volleyball.jpg' %}" alt="Vôlei">
                    <span>Vôlei</span>
                </a>
            </div>
            <div class="sport-icon">
                <a href="{% url 'available_places' %}">
                    <img src="{% static 'images/tennis.jpg' %}" alt="Tênis">
                    <span>Tênis</span>
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
